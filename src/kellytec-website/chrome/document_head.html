<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{document.title}}</title>
  <meta name="description" content="{{document.description}}" />
{{document.robots}}
  <meta name="theme-color" content="#fcfcfc" />

  <link rel="icon" type="image/svg+xml" href="{{asset.prefix}}assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
{{document.preload}}
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400..700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{asset.prefix}}assets/styles.css" />
</head>
