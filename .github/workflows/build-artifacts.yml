name: Build artifacts and deploy website

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read pinned test tooling revision
        id: test-tools
        run: python -c "import json, os; v=json.load(open('.github/test-tools.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('sha='+v['tool_sha']+'\n')"
      - name: Create read-only tooling token
        id: tools-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: Kelly-Technologies-Limited
          repositories: kellytec-platforms
          permission-contents: read
      - name: Checkout pinned test tooling
        uses: actions/checkout@v4
        with:
          repository: Kelly-Technologies-Limited/kellytec-platforms
          ref: ${{ steps.test-tools.outputs.sha }}
          token: ${{ steps.tools-app.outputs.token }}
          path: .automation-tools
          persist-credentials: false
      - name: Make pinned test tooling importable
        run: echo "PYTHONPATH=${{ github.workspace }}/.automation-tools" >> "$GITHUB_ENV"
      - run: python -m pip install build pytest
      - run: python scripts/build_site.py
      - run: python scripts/sync_frontend_chrome.py
      - run: python -m build --wheel kellytec-design-system
      - run: python -m pip install --no-deps kellytec-design-system/dist/*.whl
      - run: python -c "from pathlib import Path; from kellytec_automation.testing.profiles import run_profile; run_profile(Path.cwd(), 'build-artifacts')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: kellytec-design-system-wheel
          path: kellytec-design-system/dist/*.whl
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
