name: Build artifacts and deploy website

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python scripts/build_site.py
      - run: python scripts/sync_frontend_chrome.py
      - run: python -m build --wheel kellytec-design-system
      - run: python -m pip install --no-deps kellytec-design-system/dist/*.whl
      - run: python -m pytest -q kellytec-website/tests kellytec-design-system/tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: kellytec-design-system-wheel
          path: kellytec-design-system/dist/*.whl
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy public website
        id: deployment
        uses: actions/deploy-pages@v4
