name: Deploy kellytec-website to GitHub Pages
'on':
  workflow_run:
    workflows:
    - Check kellytec-website
    types:
    - completed
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: kellytec-website-pages
  cancel-in-progress: false
jobs:
  verify_qualified_artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name
      == github.repository && github.event.workflow_run.event != 'repository_dispatch' }}
    outputs:
      available: ${{ steps.verify.outputs.available }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      automation_sha: ${{ steps.verify.outputs.automation_sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-platforms
          kellytec-frontend
          kellytec-engines
        permission-contents: read
        permission-actions: read
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2
    - name: Install accepted Automation release
      id: bootstrap
      run: python .github/automation/common/scripts/install_automation.py
    - id: verify
      env:
        GH_TOKEN: ${{ github.token }}
      run: python .github/automation/common/scripts/verify_qualified_artifacts.py --product kellytec-website
    - uses: actions/upload-artifact@v4
      with:
        name: verified-kellytec-website
        path: |-
          dist/site
          .automation/kellytec-website
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
      if: ${{ steps.verify.outputs.available == 'true' && steps.verify.outputs.verified_restored != 'true' }}
  deploy_website:
    runs-on: ubuntu-latest
    needs: verify_qualified_artifacts
    if: ${{ needs.verify_qualified_artifacts.outputs.available == 'true' }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.verify_qualified_artifacts.outputs.source_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-platforms
          kellytec-frontend
          kellytec-engines
        permission-contents: read
        permission-actions: read
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2
    - name: Install accepted Automation release
      id: bootstrap
      run: python .github/automation/common/scripts/install_automation.py
    - uses: actions/download-artifact@v4
      with:
        name: verified-kellytec-website
        path: .
    - id: prepare
      run: python .github/automation/deploy-kellytec-website-to-github-pages/scripts/deploy_website.py
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        name: ${{ steps.prepare.outputs.artifact_name }}
        path: ${{ steps.prepare.outputs.directory }}
    - uses: actions/deploy-pages@v4
      id: deployment
      with:
        artifact_name: ${{ steps.prepare.outputs.artifact_name }}
    - run: python .github/automation/deploy-kellytec-website-to-github-pages/scripts/deploy_website.py
      env:
        PAGES_DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
    - uses: actions/upload-artifact@v4
      with:
        name: pages-deployment-evidence-${{ github.run_attempt }}
        path: .automation/kellytec-website/deployment.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
