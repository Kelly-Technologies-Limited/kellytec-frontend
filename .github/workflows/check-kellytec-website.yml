name: Check kellytec-website
'on':
  pull_request: null
  push:
    branches:
    - main
  workflow_dispatch: null
  repository_dispatch:
    types:
    - automation-compatibility
permissions:
  contents: read
  actions: read
concurrency:
  group: Check kellytec-website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  detect_product_changes:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.detect.outputs.products }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
      repository_ready: ${{ steps.detect.outputs.repository_ready }}
      bootstrap_sha: ${{ steps.bootstrap.outputs.sha }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: 'kellytec-platforms

          kellytec-frontend

          kellytec-engines'
        permission-contents: read
        permission-actions: read
    - uses: actions/checkout@v4
      with:
        repository: Kelly-Technologies-Limited/kellytec-platforms
        ref: main
        path: .automation-tools
        token: ${{ steps.tools_app.outputs.token }}
        persist-credentials: false
    - name: Install frozen Automation source
      run: python -m pip install --no-deps -e ./.automation-tools/kellytec-automation
    - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.automation-tools" >> "$GITHUB_ENV"
    - id: bootstrap
      run: echo "sha=$(git -C .automation-tools rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - id: detect
      run: python .github/automation/common/scripts/detect_product_changes.py
  resolve_source_and_dependencies:
    runs-on: ubuntu-latest
    needs: detect_product_changes
    if: ${{ needs.detect_product_changes.outputs.repository_ready == 'true' && contains(fromJSON(needs.detect_product_changes.outputs.products),
      'kellytec-website') }}
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      automation_sha: ${{ steps.resolve.outputs.automation_sha }}
      snapshot_id: ${{ steps.resolve.outputs.snapshot_id }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.detect_product_changes.outputs.source_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: 'kellytec-platforms

          kellytec-frontend

          kellytec-engines'
        permission-contents: read
        permission-actions: read
    - uses: actions/checkout@v4
      with:
        repository: Kelly-Technologies-Limited/kellytec-platforms
        ref: ${{ needs.detect_product_changes.outputs.bootstrap_sha }}
        path: .automation-tools
        token: ${{ steps.tools_app.outputs.token }}
        persist-credentials: false
    - name: Install frozen Automation source
      run: python -m pip install --no-deps -e ./.automation-tools/kellytec-automation
    - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.automation-tools" >> "$GITHUB_ENV"
    - id: resolve
      env:
        GH_TOKEN: ${{ steps.tools_app.outputs.token }}
      run: python .github/automation/common/scripts/resolve_source_and_dependencies.py --product kellytec-website
    - uses: actions/upload-artifact@v4
      with:
        name: snapshot-kellytec-website
        path: .automation/kellytec-website/snapshot.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
      if: ${{ steps.resolve.outputs.restored != 'true' }}
  check_website:
    runs-on: ubuntu-latest
    needs:
    - resolve_source_and_dependencies
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.resolve_source_and_dependencies.outputs.source_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: 'kellytec-platforms

          kellytec-frontend

          kellytec-engines'
        permission-contents: read
        permission-actions: read
    - uses: actions/checkout@v4
      with:
        repository: Kelly-Technologies-Limited/kellytec-platforms
        ref: ${{ needs.resolve_source_and_dependencies.outputs.automation_sha }}
        path: .automation-tools
        token: ${{ steps.tools_app.outputs.token }}
        persist-credentials: false
    - name: Install frozen Automation source
      run: python -m pip install --no-deps -e ./.automation-tools/kellytec-automation
    - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.automation-tools" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v4
      with:
        name: snapshot-kellytec-website
        path: .automation/kellytec-website
    - run: python -m pip install pytest build
    - run: python .github/automation/check-kellytec-website/scripts/check_website.py
  build_website:
    runs-on: ubuntu-latest
    needs:
    - resolve_source_and_dependencies
    - check_website
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: ${{ needs.resolve_source_and_dependencies.outputs.source_sha }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: tools_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: 'kellytec-platforms

          kellytec-frontend

          kellytec-engines'
        permission-contents: read
        permission-actions: read
    - uses: actions/checkout@v4
      with:
        repository: Kelly-Technologies-Limited/kellytec-platforms
        ref: ${{ needs.resolve_source_and_dependencies.outputs.automation_sha }}
        path: .automation-tools
        token: ${{ steps.tools_app.outputs.token }}
        persist-credentials: false
    - name: Install frozen Automation source
      run: python -m pip install --no-deps -e ./.automation-tools/kellytec-automation
    - run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.automation-tools" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@v4
      with:
        name: snapshot-kellytec-website
        path: .automation/kellytec-website
    - run: python -m pip install pytest build
    - run: python .github/automation/check-kellytec-website/scripts/build_website.py
      id: artifact
    - uses: actions/upload-artifact@v4
      with:
        name: qualified-kellytec-website
        path: .automation/qualified/kellytec-website
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 90
      if: ${{ steps.artifact.outputs.restored != 'true' }}
env:
  GH_TOKEN: ${{ github.token }}
