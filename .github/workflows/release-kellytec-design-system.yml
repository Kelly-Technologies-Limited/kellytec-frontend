name: Release kellytec-design-system
'on':
  workflow_run:
    workflows:
    - Check and Build kellytec-design-system
    types:
    - completed
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: release-kellytec-design-system
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare_release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: reader_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-frontend
          kellytec-platforms
        permission-contents: read
        permission-actions: read
    - run: echo "GH_TOKEN=${{ steps.reader_app.outputs.token }}" >> "$GITHUB_ENV"
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2 twine==6.2.0
    - run: python .github/automation/common/scripts/install_automation.py
    - uses: actions/create-github-app-token@v2
      id: release_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: kellytec-frontend
        permission-contents: write
        permission-actions: read
        permission-administration: read
    - run: python .github/automation/release-kellytec-design-system/scripts/prepare_release.py
      env:
        GH_TOKEN: ${{ steps.release_app.outputs.token }}
      id: prepare
    - uses: actions/upload-artifact@v4
      if: ${{ steps.prepare.outputs.available == 'true' }}
      with:
        name: package-release-${{ github.run_attempt }}
        path: .automation/package-release
        include-hidden-files: true
        if-no-files-found: error
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event
      == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    outputs:
      available: ${{ steps.prepare.outputs.available }}
      tag: ${{ steps.prepare.outputs.tag }}
      completed_tag: ${{ steps.prepare.outputs.completed_tag }}
      artifact: package-release-${{ github.run_attempt }}
  publish_package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: reader_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-frontend
          kellytec-platforms
        permission-contents: read
        permission-actions: read
    - run: echo "GH_TOKEN=${{ steps.reader_app.outputs.token }}" >> "$GITHUB_ENV"
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2 twine==6.2.0
    - run: python .github/automation/common/scripts/install_automation.py
    - uses: actions/create-github-app-token@v2
      id: release_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: kellytec-frontend
        permission-contents: write
        permission-actions: read
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_PUBLISH_PROVIDER }}
        service_account: ${{ vars.PACKAGE_PUBLISH_ACCOUNT }}
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.prepare_release.outputs.artifact }}
        path: .automation/package-release
    - run: python .github/automation/release-kellytec-design-system/scripts/publish_package.py
      env:
        GH_TOKEN: ${{ steps.release_app.outputs.token }}
    needs: prepare_release
    if: ${{ needs.prepare_release.outputs.available == 'true' }}
  finalize_release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: reader_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-frontend
          kellytec-platforms
        permission-contents: read
        permission-actions: read
    - run: echo "GH_TOKEN=${{ steps.reader_app.outputs.token }}" >> "$GITHUB_ENV"
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2 twine==6.2.0
    - run: python .github/automation/common/scripts/install_automation.py
    - uses: actions/create-github-app-token@v2
      id: release_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: kellytec-frontend
        permission-contents: write
        permission-actions: read
        permission-administration: read
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.prepare_release.outputs.artifact }}
        path: .automation/package-release
    - run: python .github/automation/release-kellytec-design-system/scripts/finalize_release.py
      env:
        GH_TOKEN: ${{ steps.release_app.outputs.token }}
        RELEASE_NEEDS: ${{ toJSON(needs) }}
    needs:
    - prepare_release
    - publish_package
    if: ${{ needs.prepare_release.outputs.available == 'true' }}
  notify_consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/create-github-app-token@v2
      id: reader_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-frontend
          kellytec-platforms
        permission-contents: read
        permission-actions: read
    - run: echo "GH_TOKEN=${{ steps.reader_app.outputs.token }}" >> "$GITHUB_ENV"
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.PACKAGE_READ_PROVIDER }}
        service_account: ${{ vars.PACKAGE_READ_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@v2
    - run: python -m pip install keyrings.google-artifactregistry-auth==1.1.2 twine==6.2.0
    - run: python .github/automation/common/scripts/install_automation.py
    - uses: actions/create-github-app-token@v2
      id: release_app
      with:
        app-id: ${{ vars.AUTOMATION_APP_ID }}
        private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        owner: Kelly-Technologies-Limited
        repositories: |-
          kellytec-frontend
          kellytec-platforms
          project-algo3-monitors
        permission-contents: write
        permission-actions: read
    - run: python .github/automation/release-kellytec-design-system/scripts/notify_consumers.py
      env:
        GH_TOKEN: ${{ steps.release_app.outputs.token }}
        RELEASE_TAG: ${{ needs.prepare_release.outputs.tag || needs.prepare_release.outputs.completed_tag }}
    needs:
    - prepare_release
    - finalize_release
    if: ${{ always() && needs.prepare_release.result == 'success' && (needs.finalize_release.result == 'success'
      || needs.prepare_release.outputs.completed_tag != '') }}
